<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Block Party</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="screen active">
  <div class="topbar">
    <button class="back" onclick="location.href='../index.html'">←</button>
    <h1>Block Party</h1>
    <div class="spacer"></div>
  </div>
  <div class="mini-hud">
    <div class="hud-box"><div class="label">Score</div><div class="val" id="hudScore">0</div></div>
    <div class="hud-box"><div class="label">Best (D/W/All)</div><div class="val" id="hudBests" style="font-size:13px">0 / 0 / 0</div></div>
    <button id="newBtn" title="New game">🔄</button>
  </div>
  <div class="game-area"><canvas id="board"></canvas></div>
</div>

<!-- Game over -->
<div class="overlay" id="overOverlay">
  <div class="dialog">
    <h2>Game Over</h2>
    <p style="font-size:28px;color:var(--text)"><b id="finalScore">0</b></p>
    <p id="recordNote"></p>
    <div class="scores-row" id="finalBests"></div>
    <button class="primary" id="restartBtn">Play Again</button>
  </div>
</div>

<script src="blockparty.js"></script>
</body>
</html>
